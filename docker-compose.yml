services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: raiffeisen
      POSTGRES_PASSWORD: raiffeisen
      POSTGRES_DB: raiffeisen
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h forces TCP, so the check stays red while the init scripts run on the socket-only temp server.
      test: ["CMD-SHELL", "pg_isready -U raiffeisen -h localhost"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://raiffeisen:raiffeisen@db:5432/raiffeisen
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    command: sh -c "npx prisma migrate deploy && node dist/seed/seed.js && node dist/main.js"
    networks:
      default:
      # Shared reverse-proxy network (Caddy reaches the API as raiffeisen-api:3000).
      proxy:
        aliases:
          - raiffeisen-api

networks:
  proxy:
    external: true

volumes:
  pgdata:
